name: release

# Builds the agflow CLI for the machines runners use and attaches the binaries to the GitHub release named after the
# tag. Pushing a tag v* starts it; so does a run by hand, which names the tag and builds the commit it runs on. A tag
# that already exists must be at that commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.2.0; a new one is made at the commit this run builds
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            bun-target: bun-darwin-arm64
          - target: linux-x64
            os: ubuntu-latest
            bun-target: bun-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            bun-target: bun-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build the CLI
        env:
          TARGET: ${{ matrix.target }}
          BUN_TARGET: ${{ matrix.bun-target }}
        run: |
          bun run build:cli --target="$BUN_TARGET"
          mv dist/agflow "dist/agflow-$TARGET"
      # The binaries built for the machine's own platform must start.
      - name: Run the binary
        if: matrix.target != 'linux-arm64'
        env:
          TARGET: ${{ matrix.target }}
        run: '"dist/agflow-$TARGET" version'
      - uses: actions/upload-artifact@v4
        with:
          name: agflow-${{ matrix.target }}
          path: dist/agflow-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          chmod +x dist/agflow-*
          if tagged=$(gh api "repos/$GH_REPO/commits/tags/$TAG" --jq .sha 2>/dev/null) && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "$TAG is at $tagged, not at $GITHUB_SHA, the commit this run built" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/agflow-* --clobber
          else
            gh release create "$TAG" dist/agflow-* --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
