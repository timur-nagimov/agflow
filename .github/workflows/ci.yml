name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: bun test with a process watchdog
        run: |
          watchdog() {
            for i in $(seq 1 12); do
              sleep 15
              echo "=== watchdog t=$((i*15))s"
              ps -eo pid,ppid,pgid,stat,etimes,wchan:32,args --forest | grep -v 'ps -eo' | awk 'NR==1 || /bun|git|sh -c|sleep|expect|node/' | cut -c1-220 | head -60
              for p in $(ps -eo pid=,etimes=,comm= | awk '$2>8 && ($3 ~ /^git/) {print $1}'); do
                echo "--- stuck $p: $(tr '\0' ' ' < /proc/$p/cmdline | cut -c1-200)"
                echo "cwd: $(readlink /proc/$p/cwd)"
                sudo cat /proc/$p/stack 2>/dev/null | head -12
                ls -l /proc/$p/fd 2>/dev/null | head -12
              done
            done
          }
          watchdog &
          timeout 190 bun test 2>&1 | head -400 || true
