name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        prep: [full, none]
        rep: [1, 2, 3]
    name: test (${{ matrix.prep }} ${{ matrix.rep }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - if: matrix.prep == 'full'
        run: bun run typecheck
      - if: matrix.prep == 'full'
        run: bun run build:web
      - name: bun test with a process watchdog
        run: |
          tree() { for c in $(ps -o pid= --ppid "$1"); do echo "$c"; tree "$c"; done; }
          watchdog() {
            for i in $(seq 1 16); do
              sleep 15
              bunpid=$(pgrep -fx 'bun test' | head -1)
              echo "=== watchdog t=$((i*15))s bun=$bunpid"
              [ -n "$bunpid" ] || continue
              echo "bun: $(ps -o stat=,wchan:32= -p $bunpid) threads=$(ls /proc/$bunpid/task | wc -l) fds=$(ls /proc/$bunpid/fd | wc -l)"
              for p in $(tree "$bunpid"); do
                [ -d /proc/$p ] || continue
                line=$(ps -o pid=,ppid=,pgid=,stat=,etimes=,wchan:32=,args= -p "$p" | cut -c1-230)
                echo "  $line"
                et=$(ps -o etimes= -p "$p" | tr -d ' ')
                if [ -n "$et" ] && [ "$et" -gt 8 ]; then
                  echo "  --- old $p cwd=$(readlink /proc/$p/cwd)"
                  sudo cat /proc/$p/stack 2>/dev/null | head -8 | sed 's/^/      /'
                  ls -l /proc/$p/fd 2>/dev/null | tail -n +2 | head -10 | sed 's/^/      /'
                fi
              done
            done
          }
          watchdog &
          timeout 240 bun test || true
