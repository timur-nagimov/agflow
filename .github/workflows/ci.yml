name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        out: [direct, tee, file]
        rep: [1, 2, 3, 4, 5]
    name: suite (${{ matrix.out }} ${{ matrix.rep }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: bun test until past the hang point
        env:
          OUT: ${{ matrix.out }}
        run: |
          # direct: bun writes straight into the Actions log pipe, as ci.yml does today.
          # tee: bun writes into a pipe that tee drains at once. file: bun writes into a regular file.
          case "$OUT" in
            direct) timeout 110 bun test || true ;;
            tee) (timeout 110 bun test || true) 2>&1 | tee out.txt > /dev/null ;;
            file) timeout 110 bun test > out.txt 2>&1 || true ;;
          esac
          if [ -f out.txt ]; then
            if grep -q '(pass) diffFingerprint > changes with HEAD' out.txt; then echo "RESULT: no-hang"; elif grep -q '(fail) diffFingerprint > changes with HEAD' out.txt; then echo "RESULT: HANG"; else echo "RESULT: unknown"; fi
          fi
