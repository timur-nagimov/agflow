name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        watch: [on, off]
        rep: [1, 2, 3, 4, 5]
    name: suite (watch ${{ matrix.watch }} ${{ matrix.rep }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: bun test until past the hang point
        env:
          AGFLOW_DEBUG_NO_WATCH: ${{ matrix.watch == 'off' && '1' || '' }}
        run: |
          timeout 110 bun test > out.txt 2>&1 || true
          grep -E 'a deleted clone is reported|fsAgeMs follows|diffFingerprint|readCloneRefs > reads the head' out.txt | cut -c1-160
          if grep -q '(pass) diffFingerprint > changes with HEAD' out.txt; then echo "RESULT: no-hang"; elif grep -q '(fail) diffFingerprint > changes with HEAD' out.txt; then echo "RESULT: HANG"; else echo "RESULT: unknown"; tail -5 out.txt; fi
